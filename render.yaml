services:
  - type: web
    name: qc-dashboard
    runtime: node
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: qc-dashboard-db
          property: connectionString
      - key: GREENAPI_INSTANCE_ID
        sync: false
      - key: GREENAPI_API_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NEXT_PUBLIC_BASE_URL
        sync: false
      - key: NODE_ENV
        value: production
    healthCheckPath: /api/health

databases:
  - name: qc-dashboard-db
    databaseName: qc_dashboard
    user: qc_user
    plan: free
